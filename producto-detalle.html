<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle de Producto | Sonidos Vergatarios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/Estilos.css">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

    <!-- HEADER / NAVBAR -->
    <header class="sticky-top">
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
            <div class="container-fluid px-4">
                <a class="navbar-brand fw-bold text-warning fs-3 me-auto" href="home.html">Sonidos Vergatarios</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse flex-grow-0" id="navbarNav">
                    <ul class="navbar-nav align-items-center gap-3 me-3">
                        <li class="nav-item">
                            <a class="nav-link text-white" href="home.html">Home</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link fw-bold text-white" href="productos.html">Productos</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white" href="nosotros.html">Nosotros</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white" href="contacto.html">Contacto</a>
                        </li>
                    </ul>
                    <div class="d-flex align-items-center gap-2">
                        <a href="login.html" class="btn btn-outline-warning">Iniciar Sesión</a>
                        <a href="registro.html" class="btn btn-warning fw-semibold">Registrarse</a>
                        <a href="carrito.html" class="btn btn-warning position-relative ms-1">
                            <i class="bi bi-cart-fill me-1"></i> Carrito
                            <span id="cart-badge" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">0</span>
                        </a>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <main class="container my-5">
        <div class="row g-4 bg-white p-4 rounded shadow-sm">
            <div class="col-md-6 text-center">
                <img id="prod-img" src="" class="img-fluid rounded" style="max-height: 350px; object-fit: contain;">
            </div>
            <div class="col-md-6 d-flex flex-column justify-content-center">
                <span class="badge bg-secondary w-auto align-self-start mb-2" id="prod-cat"></span>
                <h2 class="fw-bold" id="prod-nombre"></h2>
                <p class="text-muted" id="prod-specs"></p>
                <h3 class="text-warning fw-bold my-3" id="prod-precio"></h3>
                <p class="text-secondary" id="prod-desc"></p>
                
                <div class="d-flex align-items-center gap-3 my-3">
                    <label class="fw-bold">Cantidad:</label>
                    <input type="number" id="prod-cantidad" class="form-control text-center" value="1" min="1" max="10" style="width: 80px;">
                </div>

                <button class="btn btn-warning btn-lg fw-bold" id="btn-add-detail">
                    <i class="bi bi-cart-plus me-2"></i> Agregar al Carrito
                </button>
            </div>
        </div>

        <!-- SECCIÓN DE RECOMENDACIONES -->
        <section class="mt-5">
            <h4 class="fw-bold mb-4">Productos Recomendados</h4>
            <div class="row row-cols-1 row-cols-sm-2 row-cols-md-4 g-3" id="contenedor-recomendaciones">
                <!-- Se llena dinámicamente -->
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/productos.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const params = new URLSearchParams(window.location.search);
            const id = params.get("id") || "GA001";
            
            const prod = listaProductos.find(p => String(p.id) === String(id)) || listaProductos[0];

            document.getElementById("prod-img").src = prod.img;
            document.getElementById("prod-cat").textContent = prod.categoria;
            document.getElementById("prod-nombre").textContent = prod.nombre;
            document.getElementById("prod-specs").textContent = `Marca: ${prod.marca} | Modelo: ${prod.modelo}`;
            document.getElementById("prod-precio").textContent = `$${prod.precio.toLocaleString('cl-CL')}`;
            document.getElementById("prod-desc").textContent = prod.desc;

            document.getElementById("btn-add-detail").addEventListener("click", () => {
                const cant = parseInt(document.getElementById("prod-cantidad").value) || 1;
                if (typeof agregarAlCarrito === "function") {
                    agregarAlCarrito(prod.id, cant);
                }
                alert(`¡Se agregaron ${cant} unidad(es) al carrito!`);
            });

            // RENDERIZAR RECOMENDADOS CON EL NOMBRE CORREGIDO: producto-detalle.html
            const contenedorRec = document.getElementById("contenedor-recomendaciones");
            const recomendados = listaProductos.filter(p => String(p.id) !== String(prod.id)).slice(0, 4);

            recomendados.forEach(item => {
                contenedorRec.innerHTML += `
                    <div class="col">
                        <div class="card h-100 shadow-sm border-0 p-2">
                            <a href="producto-detalle.html?id=${item.id}" class="text-decoration-none text-dark">
                                <img src="${item.img}" class="card-img-top" style="height: 140px; object-fit: contain;" alt="${item.nombre}">
                                <div class="card-body p-2 d-flex flex-column text-center">
                                    <h6 class="card-title text-truncate fw-bold mb-1">${item.nombre}</h6>
                                    <span class="text-warning fw-bold mb-2">$${item.precio.toLocaleString('cl-CL')}</span>
                                </div>
                            </a>
                            <div class="text-center mt-auto p-2">
                                <a href="producto-detalle.html?id=${item.id}" class="btn btn-sm btn-outline-warning w-100">Ver producto</a>
                            </div>
                        </div>
                    </div>
                `;
            });
        });
    </script>
</body>
</html>
