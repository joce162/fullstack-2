<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sonidos Vergatarios | Registro de Usuario</title>

  <!-- CDN de Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Estilos del Login y Registro -->
  <link rel="stylesheet" href="css/estilo_login.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <main class="login-wrapper py-4">
    <div class="login-card login-card-wide">

      <div class="marca text-center mb-3">
        <a href="index.html" class="text-decoration-none">
          <span class="marca-nombre h3 fw-bold text-warning">Sonidos Vergatarios</span>
        </a>
      </div>

      <h2 class="registro-titulo h4 text-center mb-4">Registro de usuario</h2>

      <form id="registroForm" novalidate>
        <div class="mb-3">
          <label for="nombre" class="form-label">Nombre completo</label>
          <input type="text" class="form-control login-input" id="nombre" name="nombre" maxlength="100" required>
          <span class="error" id="error-nombre" aria-live="polite"></span>
        </div>

        <div class="mb-3">
          <label for="correo" class="form-label">Correo</label>
          <input type="email" class="form-control login-input" id="correo" name="correo" placeholder="tucorreo@duoc.cl" maxlength="100" required>
          <span class="error" id="error-correo" aria-live="polite"></span>
        </div>

        <div class="mb-3">
          <label for="confirmarCorreo" class="form-label">Confirmar correo</label>
          <input type="email" class="form-control login-input" id="confirmarCorreo" name="confirmarCorreo" maxlength="100" required>
          <span class="error" id="error-confirmarCorreo" aria-live="polite"></span>
        </div>

        <div class="mb-3">
          <label for="password" class="form-label">Contraseña</label>
          <input type="password" class="form-control login-input" id="password" name="password" placeholder="Entre 4 y 10 caracteres" minlength="4" maxlength="10" required>
          <span class="error" id="error-password" aria-live="polite"></span>
        </div>

        <div class="mb-3">
          <label for="confirmarPassword" class="form-label">Confirmar contraseña</label>
          <input type="password" class="form-control login-input" id="confirmarPassword" name="confirmarPassword" minlength="4" maxlength="10" required>
          <span class="error" id="error-confirmarPassword" aria-live="polite"></span>
        </div>

        <div class="mb-3">
          <label for="telefono" class="form-label">Teléfono (opcional)</label>
          <input type="tel" class="form-control login-input" id="telefono" name="telefono" maxlength="15">
        </div>

        <div class="row g-3 mb-3">
          <div class="col-sm-6">
            <label for="region" class="form-label">Región</label>
            <select class="form-select login-input" id="region" name="region" required>
              <option value="" selected disabled>-- Seleccione la región --</option>
              <option value="santiago">Santiago</option>
              <option value="vina">Viña del Mar</option>
              <option value="valparaiso">Valparaíso</option>
            </select>
            <span class="error" id="error-region" aria-live="polite"></span>
          </div>
          <div class="col-sm-6">
            <label for="comuna" class="form-label">Comuna</label>
            <select class="form-select login-input" id="comuna" name="comuna" required disabled>
              <option value="" selected disabled>-- Seleccione la comuna --</option>
            </select>
            <span class="error" id="error-comuna" aria-live="polite"></span>
          </div>
        </div>

        <span class="error error-general" id="error-general" aria-live="polite"></span>

        <button type="submit" class="btn btn-warning w-100 fw-bold mt-2" id="btnRegistrar">
          <span class="btn-text">REGISTRAR</span>
          <span class="spinner" hidden></span>
        </button>
      </form>

      <div class="text-center mt-3">
        <a href="login.html" class="login-back text-warning">&larr; Volver a inicio de sesión</a>
      </div>

    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/registro.js"></script>
</body>
</html>
