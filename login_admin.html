<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administración - SonidosVergatarios</title>

    <!--Proteccion de acceso-->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/estilo_login.css">
</head>
<body>

  <main class="login-wrapper">
    <div class="login-card">

      <div class="marca">
        <svg class="marca-logo" width="52" height="52" viewBox="0 0 64 64" fill="none" aria-hidden="true">
          <clipPath id="marcoLogin">
            <rect width="64" height="64" rx="14"/>
          </clipPath>
          <g clip-path="url(#marcoLogin)">
            <rect width="64" height="21.3" y="0" fill="#FFCC00"/>
            <rect width="64" height="21.4" y="21.3" fill="#00247D"/>
            <rect width="64" height="21.3" y="42.7" fill="#CF142B"/>
            <g fill="#fff">
              <circle cx="24" cy="32" r="1.5"/>
              <circle cx="29" cy="29.5" r="1.5"/>
              <circle cx="34" cy="28.5" r="1.5"/>
              <circle cx="39" cy="29.5" r="1.5"/>
              <circle cx="44" cy="32" r="1.5"/>
            </g>
          </g>
          <path d="M8 6 L18 4 L20 14 L10 16 Z" fill="#fff"/>
          <circle cx="11" cy="7" r="1.4" fill="#2b1c14"/>
          <circle cx="16" cy="5.5" r="1.4" fill="#2b1c14"/>
          <rect x="17" y="12" width="6" height="24" rx="1" transform="rotate(20 20 24)" fill="#fff"/>
          <path d="M30 30
                   c6 -4 14 -3 18 3
                   c4 6 2 13 -4 17
                   c-3 2 -7 2 -10 0
                   c-2 -1 -3 -3 -5 -3
                   c-3 0 -5 3 -8 2
                   c-4 -1 -6 -5 -5 -9
                   c1 -4 5 -6 9 -7
                   c2 -1 3 -2 5 -3 Z"
                fill="#fff"/>
          <circle cx="41" cy="40" r="4.5" fill="#2b1c14"/>
          <line x1="21" y1="14" x2="43" y2="41" stroke="#2b1c14" stroke-width="0.8"/>
          <line x1="19" y1="16" x2="41" y2="43" stroke="#2b1c14" stroke-width="0.8"/>
        </svg>
        <span class="marca-nombre">SonidosVergatarios</span>
        <span class="marcoLogin">Administrador </span>
      </div>

      <!--CORREO ELECTRONICO DE L ADMINISTRADOR-->
      <form id="loginForm" novalidate>
        <div class="mb-3">
          <label for="correo" class="form-label">Email de Administrador</label>
          <!--MANEJO DE DATOS DE CORREO-->
          <input
            type="email"
            class="form-control login-input"
            id="correo"
            name="correo"
            placeholder="tucorreo@admin.cl"
            autocomplete="email"
            maxlength="100"
            required
          >
          <div class="error" id="error-correo" aria-live="polite"></div>
        </div>
        
        <!--CONTRASEÑA DEL ADMINISTRADOR-->
        <div class="mb-3">
          <label for="password" class="form-label">Contraseña</label>
          <div class="password-wrapper">
            <!--MANEJO DE DATOS DE LA CONTRASEÑA-->
            <input
              type="password"
              class="form-control login-input"
              id="password"
              name="password"
              placeholder="Clave de empresa"
              autocomplete="current-password"
              minlength="4"
              maxlength="10"
              required
            >
            <!--BOTON PARA CONTROLAR ACCIONES Y CARACTERES INGRESADOS DE LA CONTRASEÑA-->
            <button type="button" class="toggle-password" id="togglePassword" aria-label="Mostrar contraseña" aria-pressed="false">
              <svg class="icon-eye" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              <svg class="icon-eye-off" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" hidden>
                <path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a18.6 18.6 0 0 1 5.06-5.94M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 7 11 7a18.6 18.6 0 0 1-2.22 3.12M14.12 14.12a3 3 0 1 1-4.24-4.24"/>
                <line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
            </button>
            <!--VALIDACION DE ERROR DE CLAVE-->
          </div>
          <div class="error" id="error-password" aria-live="polite"></div>
        </div>

        <button type="submit" class="btn login-btn w-100" id="btnSubmit">
          <span class="btn-text">INICIAR SESIÓN</span>
          <span class="spinner" hidden></span>
        </button>
      </form>
